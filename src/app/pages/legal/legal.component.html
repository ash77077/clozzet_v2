<div class="legal-page">
  <div class="container" *ngIf="doc">

    <div class="legal-hero">
      <a [routerLink]="'/' | localeRoute" class="back-link">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="16" height="16">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        Back to Home
      </a>
      <span class="eyebrow">Legal</span>
      <h1>{{ doc.title }}</h1>
      <p class="meta">Last updated: {{ doc.lastUpdated }}</p>
    </div>

    <div class="legal-body">
      <p class="intro">{{ doc.intro }}</p>

      <div class="section" *ngFor="let s of doc.sections">
        <h2>{{ s.heading }}</h2>
        <p>{{ s.body }}</p>
      </div>

      <div class="legal-cta">
        <p>Have a question? <a href="mailto:sales@clozzet.am">sales&#64;clozzet.am</a></p>
      </div>
    </div>

  </div>
</div>
